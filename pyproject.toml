[project]
name = "a2"
version = "0.1.0"
description = "COMP90049 Assignment 2 — Wikipedia article quality classification"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.20",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "streamlit>=1.30",
    "numpy>=1.26",
]

[project.scripts]
a2 = "a2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a2"]
